<div id="rating">
    <span data-star="1">☆</span>
    <span data-star="2">☆</span>
    <span data-star="3">☆</span>
    <span data-star="4">☆</span>
    <span data-star="5">☆</span>
    <p id="rating-result"></p>
  </div>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";
  
    const firebaseConfig = {
      apiKey: "AIzaSyDfAlyWJtURdzIE9gMCh19UrrUW2xcGUz8",
      authDomain: "focaccias-d746d.firebaseapp.com",
      projectId: "focaccias-d746d"
    };
  
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
  
    const pageId = "{{ .Permalink }}"; // unique per page
    const stars = document.querySelectorAll("#rating span");
    const result = document.getElementById("rating-result");
  
    async function getRating() {
      const docRef = doc(db, "ratings", pageId);
      const docSnap = await getDoc(docRef);
      if (docSnap.exists()) {
        result.textContent = `Average: ${docSnap.data().average.toFixed(1)} ⭐`;
      } else {
        result.textContent = "No ratings yet";
      }
    }
  
    stars.forEach(star => {
      star.addEventListener("click", async () => {
        const value = parseInt(star.dataset.star);
        await setDoc(doc(db, "ratings", pageId), { average: value }, { merge: true });
        getRating();
      });
    });
  
    getRating();
  </script>
