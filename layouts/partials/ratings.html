<div id="rating">
  <span data-star="1">☆</span>
  <span data-star="2">☆</span>
  <span data-star="3">☆</span>
  <span data-star="4">☆</span>
  <span data-star="5">☆</span>
  <p id="rating-result"></p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
  import { 
    getFirestore, doc, getDoc, setDoc, updateDoc, increment 
  } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDfAlyWJtURdzIE9gMCh19UrrUW2xcGUz8",
    authDomain: "focaccias-d746d.firebaseapp.com",
    projectId: "focaccias-d746d"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const pageId = "{{ .Permalink }}".replace(/[\/:]+/g, "_");
  const stars = document.querySelectorAll("#rating span");
  const result = document.getElementById("rating-result");

  // 🔒 Check if already voted this session
  const votedKey = `voted_${pageId}`;
  let hasVoted = sessionStorage.getItem(votedKey) === "true";

  // 💫 helper: visually fill stars
  function fillStars(avg) {
    stars.forEach((s, i) => {
      s.textContent = (i + 1) <= avg ? "★" : "☆";
      s.style.color = (i + 1) <= avg ? "black" : "gray";
    });
  }

  async function getRating() {
    const ref = doc(db, "ratings", pageId);
    const snap = await getDoc(ref);
    if (snap.exists()) {
      const data = snap.data();
      const avg = (data.total / data.count).toFixed(1);
      fillStars(Math.round(avg));
      result.textContent = `Average: ${avg} ☆ (${data.count} votes)`;
    } else {
      fillStars(0);
      result.textContent = "No ratings yet";
    }
  }

  // ⭐ handle click only if not voted
  stars.forEach(star => {
    star.addEventListener("click", async () => {
      if (hasVoted) {
        alert("You already rated this page this session!");
        return;
      }

      const value = parseInt(star.dataset.star);
      const ref = doc(db, "ratings", pageId);
      const snap = await getDoc(ref);

      if (snap.exists()) {
        await updateDoc(ref, {
          total: increment(value),
          count: increment(1)
        });
      } else {
        await setDoc(ref, { total: value, count: 1 });
      }

      fillStars(value);
      sessionStorage.setItem(votedKey, "true");
      hasVoted = true;
      await getRating();
    });
  });

  getRating();
</script>

<style>
  #rating span {
    cursor: pointer;
    transition: color 0.2s, transform 0.1s;
  }
  #rating span:hover {
    transform: scale(1.2);
  }
</style>
